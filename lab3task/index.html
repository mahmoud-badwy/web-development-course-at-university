<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>iOS Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator">
        <h1>iOS Calculator</h1>

        <p id="display">0</p>

        <div id="keys">
            <div class="row">
                <button class="key light">AC</button>
                <button class="key">00</button>
                <button class="key">%</button>
                <button class="key operator">&divide;</button>
            </div>
            <div class="row">
                <button class="key">7</button>
                <button class="key">8</button>
                <button class="key">9</button>
                <button class="key operator">&times;</button>
            </div>
            <div class="row">
                <button class="key">4</button>
                <button class="key">5</button>
                <button class="key">6</button>
                <button class="key operator">&minus;</button>
            </div>
            <div class="row">
                <button class="key">1</button>
                <button class="key">2</button>
                <button class="key">3</button>
                <button class="key operator">+</button>
            </div>
            <div class="row">
                <button class="key zero">0</button>
                <button class="key">.</button>
                <button class="key operator">=</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
